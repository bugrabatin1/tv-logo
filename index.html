<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Animasyonu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #dvd-logo {
            position: absolute;
            width: 400px;
            top: 0;
            left: 0;
        }
        /* Tam Ekran Butonu Tasarımı */
        #tam-ekran-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.3);
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            z-index: 1000;
        }
        #tam-ekran-btn:focus, #tam-ekran-btn:hover {
            background-color: rgba(255, 255, 255, 0.7);
            color: black;
        }
    </style>
</head>
<body>

    <!-- Tıklanabilir buton -->
    <button id="tam-ekran-btn" onclick="tamEkranYap()">Tam Ekran Yap</button>
    
    <img id="dvd-logo" src="logo.jpg" alt="Logo">

    <script>
        var logo = document.getElementById('dvd-logo');
        var buton = document.getElementById('tam-ekran-btn');
        
        var x = Math.random() * 100;
        var y = Math.random() * 100;
        var dx = 1;
        var dy = 1;

        // Butona basıldığında çalışacak fonksiyon
        function tamEkranYap() {
            var docElm = document.documentElement;
            // Farklı tarayıcılar ve eski TV'ler için tam ekran komutları
            if (docElm.requestFullscreen) {
                docElm.requestFullscreen();
            } else if (docElm.webkitRequestFullScreen) {
                docElm.webkitRequestFullScreen(); 
            } else if (docElm.mozRequestFullScreen) {
                docElm.mozRequestFullScreen();
            } else if (docElm.msRequestFullscreen) {
                docElm.msRequestFullscreen();
            }
            // Görüntüyü bozmaması için tam ekrana geçince butonu gizle
            buton.style.display = "none";
        }

        function animate() {
            var screenWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
            var screenHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;

            var logoWidth = logo.clientWidth || 400;
            var logoHeight = logo.clientHeight || 200;

            if (x + logoWidth >= screenWidth) {
                x = screenWidth - logoWidth;
                dx = -dx;
            } else if (x <= 0) {
                x = 0;
                dx = -dx;
            }

            if (y + logoHeight >= screenHeight) {
                y = screenHeight - logoHeight;
                dy = -dy;
            } else if (y <= 0) {
                y = 0;
                dy = -dy;
            }

            x += dx;
            y += dy;

            logo.style.left = x + 'px';
            logo.style.top = y + 'px';

            if (window.requestAnimationFrame) {
                window.requestAnimationFrame(animate);
            } else {
                setTimeout(animate, 16);
            }
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
